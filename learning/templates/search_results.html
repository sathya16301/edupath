<!DOCTYPE html>
<html>
<head>
    <title>Search Results</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: #f5f7fb;
        }

        .top {
            background: #0d6efd;
            color: white;
            padding: 30px;
            text-align: center;
        }

        .results {
            padding: 40px;
        }

        .course-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .course-card {
            background: white;
            padding: 20px;
            text-align: center;
            text-decoration: none;
            color: #333;
            border: 1px solid #eee;
            transition: 0.3s;
        }

        .course-card:hover {
            transform: scale(1.05);
            border-color: #0d6efd;
            color: #0d6efd;
        }

        .back-link {
            display: inline-block;
            margin-top: 30px;
            color: #0d6efd;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="top">
    <h2>Search Results for "{{ query }}"</h2>
</div>

<div class="results">
    <div class="course-grid">
        {% for subject in search_results %}
            <a href="{% url 'subject_detail' subject.id %}" class="course-card">
                {{ subject.name }}
            </a>
        {% empty %}
            <p>No matching courses found.</p>
        {% endfor %}
    </div>

    <a href="{% url 'home' %}" class="back-link">← Back to Home</a>
</div>

</body>
</html>
